<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Junk Removal | Moving Company</title>

  <!-- FontAwesome -->
  <script src="https://kit.fontawesome.com/d08ed07a68.js" crossorigin="anonymous"></script>

  <!-- ORIGINAL STYLES -->
  <link rel="stylesheet" href="styles.css"/>

  <!-- HEADER STYLES COPIED FROM INDEX -->
  <style>
    header {
        background-color: transparent;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 10px 60px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
    }

    header.scrolled {
        background-color: rgba(255, 255, 255, 0.65);
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .logo-imagen {
        width: 100px;
        height: auto;
    }

    nav {
        display: flex;
        align-items: center;
        gap: 30px;
    }

    nav a {
        color: #2a2a2a;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.3s;
    }

    nav a:hover {
        color: #FDDD58;
    }

    .cta-button {
        background-color: #FDDD58;
        color: #1a1a1a;
        padding: 12px 24px;
        border-radius: 25px;
        font-weight: bold;
        text-transform: uppercase;
        font-size: 12px;
        cursor: pointer;
    }

    .services-link::after {
        content: ' ▾';
    }

    .services-dropdown {
        position: relative;
    }

    .dropdown-menu {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        background-color: #2a2a2a;
        min-width: 220px;
        border-radius: 8px;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
        margin-top: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        overflow: hidden;
    }

    .services-dropdown:hover .dropdown-menu {
        opacity: 1;
        visibility: visible;
        margin-top: 15px;
    }

    .dropdown-menu a {
        display: block;
        padding: 15px 25px;
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        transition: all 0.3s ease;
        border-bottom: 1px solid rgba(253, 221, 88, 0.1);
    }

    .dropdown-menu a:hover {
        background-color: #FDDD58;
        color: #1a1a1a;
        padding-left: 30px;
    }

    /* Hamburger */
    .hamburger {
        display: none;
        flex-direction: column;
        cursor: pointer;
        gap: 5px;
    }

    .hamburger span {
        width: 28px;
        height: 3px;
        background-color: #FDDD58;
        border-radius: 3px;
        transition: 0.3s;
    }

    @media (max-width: 767px) {
        header {
            padding: 15px 20px;
        }

        .hamburger {
            display: flex;
        }

        nav {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(26,26,26,0.98);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        nav.active {
            display: flex;
        }

        nav a {
            color: #fff;
            font-size: 20px;
        }

        .dropdown-menu {
            position: static;
            transform: none;
            opacity: 1;
            visibility: visible;
            background: transparent;
            box-shadow: none;
            max-height: 0;
            overflow: hidden;
        }

        .services-dropdown.active .dropdown-menu {
            max-height: 200px;
        }

        .dropdown-menu a {
            border-bottom: 1px solid rgba(253,221,88,.2);
        }
    }

    /* Push content below fixed header */
    body {
        padding-top: 90px;
    }
  </style>
</head>
<body>

<header>
    <div class="logo">
        <img src="imagenes/logo-smile-service.png" class="logo-imagen" alt="Logo Smile Service">
    </div>

    <nav>
        <a href="index.html">Home</a>
        <div class="services-dropdown">
            <a href="#services" class="services-link">Services</a>
            <div class="dropdown-menu">
                <a href="moving_services_updated.html">Moving</a>
                <a href="pickup.html">Pick Up and Delivery</a>
                <a href="junkremoval.html">Junk Removal</a>
            </div>
        </div>
        <a href="#about">About</a>
        <a href="#reviews">Reviews</a>
        <a href="#contact">Contact</a>
        <span class="cta-button">GET FREE QUOTE</span>
    </nav>
</header>

<!-- HERO -->
<section class="hero-bg">
  <div class="hero-overlay"></div>
  <div class="container hero-content">
    <h1>Junk Removal</h1>
    <p>
      Say goodbye to unwanted items with our professional junk removal services.
    </p>
    <a href="#" class="btn-primary">Get Free Quote</a>
  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const nav = document.querySelector('nav');
    const header = document.querySelector('header');

    const hamburger = document.createElement('div');
    hamburger.className = 'hamburger';
    hamburger.innerHTML = '<span></span><span></span><span></span>';
    header.insertBefore(hamburger, nav);

    hamburger.addEventListener('click', function () {
        hamburger.classList.toggle('active');
        nav.classList.toggle('active');
        document.body.classList.toggle('menu-open');
    });

    const servicesDropdown = document.querySelector('.services-dropdown');
    const servicesLink = document.querySelector('.services-link');

    servicesLink.addEventListener('click', function (e) {
        if (window.innerWidth <= 767) {
            e.preventDefault();
            servicesDropdown.classList.toggle('active');
        }
    });
});

window.addEventListener('scroll', function () {
    const header = document.querySelector('header');
    header.classList.toggle('scrolled', window.scrollY > 50);
});
</script>

</body>
</html>
